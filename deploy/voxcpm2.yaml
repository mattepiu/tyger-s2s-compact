# VoxCPM2 deploy config for tyger: ONE live conversation sharing the GPU with Qwen3-4B (+ EARS).
# Based on vllm_omni/deploy/voxcpm2.yaml (vllm-omni 0.30.0); changes: max_num_seqs 8->2, KV 6GiB->1GiB,
# gpu_memory_utilization 0.9->0.35 (start-up check only; KV is pinned by kv_cache_memory_bytes),
# max_model_len 4096->2048 (ref clip + one text chunk), unified decode graph batch 8->2.
# Measured (RTX 5090): ~7.4 GB loaded, ~0.6 GB more after warmup; first-audio ~113 ms, RTF 0.12-0.2.
async_chunk: false
dtype: bfloat16

stages:
  - stage_id: 0
    max_num_seqs: 2
    gpu_memory_utilization: 0.35
    kv_cache_memory_bytes: 1073741824  # 1 GiB
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 2048
    max_model_len: 2048
    devices: "0"
    engine_extras:
      hf_overrides:
        voxcpm2_runtime_config:
          audio_emit_every: 1
          vae_decode_every: 3
          enable_batched_cfm: true
          enable_batched_vae_decode: true
          coalesce_audio_d2h: true
          enable_loc_dit_fused_qkv: true
          enable_loc_dit_fused_mlp: true
          enable_loc_dit_zero_dt_cache: true
          enable_loc_dit_skip_qkv_contig: true
          enable_loc_dit_reduce_overhead_no_cg: true
          enable_unified_decode_graph: true
          unified_decode_graph_max_batch_size: 2
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.0
