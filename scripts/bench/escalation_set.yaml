# Escalation routing test set (PLUGINS.md step 11), read by scripts/bench/escalation.py. Synthetic prompts only,
# never user data, English only. Each case is one user turn with the route the `reply` model should take:
#   local  - chit-chat, simple facts, opinions, short how-tos: answered by the local model
#   tool   - the time, reminders, messages: a lookup / action tool (not ask_expert)
#   expert - maths, code, health / money / legal advice, comparisons, planning, long explanations, "think
#            carefully", unhappiness with an earlier answer, follow-ups on an escalated topic: ask_expert; and since
#            2026-10-11 live facts too (weather, news, prices, scores, opening hours: the local web search and
#            weather tools are gone, the expert searches the web itself). Those cases were `tool` before.
#   background - research, compare many options, plan a multi-day trip, draft something long: start_task (only
#            evaluated with tasks on); a status question answers locally from the note, "drop it" is a tool
# `also`: routes that count as right too (planning can be answered now or researched). `history` holds earlier
# turns in the form of config/prompts.yaml escalation.shots: {user, reply} answered locally, or {user, expert, answer}
# escalated; `status` is the background-task note MOUTH puts in front of the user's message.
# `split`: held-out cases, never used to tune the prompt, say `split: heldout`, `fresh` or `hard`; a case without
# one is `tune`. History turns may also be lookups: {user, call: {name, arguments}, result, answer}. Don't reuse the
# few-shot topics of config/prompts.yaml here.
version: 1
