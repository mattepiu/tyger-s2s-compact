# tyger v1 config. Model ids / HF paths, thresholds, voices, flags. Secrets are NOT here — they live in
# v1/.env (TAVILY_API_KEY, HF_TOKEN). Thresholds are frozen into this file at milestone V2 (live tuning).

server:
  host: 0.0.0.0
  port: 7860              # the web app (EARS aiohttp) serves the page + WS on this port
  mouth_host: 127.0.0.1
  mouth_port: 8770        # internal EARS<->MOUTH TCP

vllm:
  base_url: http://127.0.0.1:8001   # external vLLM OpenAI server for the responder (run.sh starts it)
  timeout: 60                        # per-request HTTP timeout (s)

models:
  nemotron: nvidia/nemotron-3.5-asr-streaming-0.6b
  responder: Qwen/Qwen3-4B-Instruct-2507   # served by the vLLM server above (NOT loaded in-process)
  moss_repo: OpenMOSS-Team/MOSS-TTS-Realtime
  moss_codec: OpenMOSS-Team/MOSS-Audio-Tokenizer
  moss_dir: ${HF_HOME}/tyger-moss-realtime  # vendored+patched snapshot (weights.ensure_moss_realtime writes here)
  heads_repo: nineninesix/tyger-exp10-heads
  heads_file: exp12/ep_s0/ep_best.pt    # exp-12 arm C seed 0 (LoRA + state/hazard/yield/bc/ep heads)

ears:                      # arm C endpoint rule + barge/backchannel (exp-12 live defaults; retuned live at V2)
  ep_thr: 0.9146           # p_end threshold (sel_dev tau) -- NOT yet retuned live (exp-11 found offline ~2x high)
  ep_deb: 2                # debounce frames (80 ms each)
  barge_thr: 0.5
  barge_deb: 2
  bc_thr: 0.5
  bc_deb: 2
  fallback_sil_frames: 15  # 1.2 s silence fallback (safety net; arm C fired it 0 times live in exp-12)

tts:                       # MOSS-TTS-Realtime (venv_moss, tf5.0.0); 24 kHz native, static-cache fast path
  dtype: bfloat16
  attn: sdpa
  out_sr: 24000            # native 24k -> matches the client + EARS 2nd ear (no resample)
  chunk_dur: 0.24          # codec encode chunk
  dec_chunk_frames: 4      # frames buffered before each decode (4 -> RTF ~0.67, low onset; 8 -> RTF ~0.56)
  prefill_text_len: 16     # text tokens of lookahead before audio starts; 16 keeps pronunciation clean for
                           # non-English (Russian etc.) -- 6 was too low and caused an English-accent artifact.
                           # Higher = better pronunciation but slightly later first-audio.
  prompt_max_s: 4.0        # trim the voice prompt -> smaller per-turn prefill
  max_length: 800          # StaticCache length (prompt + text + audio steps per sentence)
  channels: 16             # RVQ codebooks
  audio_temperature: 0.8
  audio_top_p: 0.6
  audio_top_k: 30
  audio_repetition_penalty: 1.1
  repetition_window: 50

voices:
  dir: /workspace/voices             # directory of *.wav reference clips (outside git; never committed)
  default_ref: /workspace/tyger/ref.wav   # single-clip fallback (the user's ref)
  default: ref                       # active voice name (stem of the chosen wav)

mouth:
  temperature: 0.7                   # sampling temperature for the vLLM responder
  max_gen: 192
  history_turns: 8                   # ~last 8 turns kept in the responder
  contextual_acks: true              # true = LLM acks reacting to the ASR partial (exp-12); false = canned
  canned_acks: ["mm-hm", "right", "yeah", "okay"]   # fallback only, used when contextual_acks is false
  bc_max_new: 12                     # token budget for a contextual ack (kept short for low latency)
